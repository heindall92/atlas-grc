<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Atlas GRC</title>
  <desc id="d">Aprende la ISO/IEC 27001 desde cero. Brújula de Atlas con la aguja buscando el norte e iconos de Lucide animados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141331"/>
      <stop offset=".55" stop-color="#2b2466"/>
      <stop offset="1" stop-color="#4b3fb8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="10%" r="45%">
      <stop offset="0" stop-color="#bf5af2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="100%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d7aff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d4ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320"/></clipPath>
  </defs>

  <style>
    .ico { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chip { fill: rgba(255,255,255,.10); stroke: rgba(255,255,255,.22); stroke-width: 1; }
    .t1 { font: 800 76px 'Segoe UI Variable Display','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif; letter-spacing: -2px; }
    .t2 { font: 500 23px 'Segoe UI Variable Text','SF Pro Text',-apple-system,'Segoe UI',system-ui,sans-serif; fill: rgba(255,255,255,.86); }
    .t3 { font: 700 13px ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace; letter-spacing: 3px; fill: #b9b4ff; }

    /* Brújula: la aguja busca el norte y se asienta (como en la app) */
    .needle { transform-box: fill-box; transform-origin: center; animation: seek 6s cubic-bezier(.23,1,.32,1) infinite; }
    @keyframes seek { 0% { transform: rotate(-70deg) } 10% { transform: rotate(28deg) } 17% { transform: rotate(-14deg) } 23% { transform: rotate(7deg) } 28% { transform: rotate(-3deg) } 33%, 100% { transform: rotate(0) } }

    /* Brillos y estrellas */
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .55 } }
    .star { animation: twinkle 3.2s ease-in-out infinite; }
    .star:nth-of-type(2n) { animation-delay: -1.1s } .star:nth-of-type(3n) { animation-delay: -2.2s }
    @keyframes twinkle { 50% { opacity: .15 } }

    /* Ondas que avanzan despacio */
    .wave1 { animation: drift 18s linear infinite; }
    .wave2 { animation: drift 26s linear infinite reverse; }
    @keyframes drift { to { transform: translateX(-640px) } }

    /* Cada icono, su gesto (inspirado en animateicons) */
    .float { transform-box: fill-box; transform-origin: center; animation: bob 5s ease-in-out infinite; }
    .f2 { animation-delay: -.8s } .f3 { animation-delay: -1.6s } .f4 { animation-delay: -2.4s } .f5 { animation-delay: -3.2s } .f6 { animation-delay: -4s }
    @keyframes bob { 50% { transform: translateY(-9px) } }
    .rock { transform-box: fill-box; transform-origin: 50% 15%; animation: rock 3.6s ease-in-out infinite; }
    @keyframes rock { 25% { transform: rotate(-9deg) } 75% { transform: rotate(9deg) } }
    .draw { stroke-dasharray: 12; stroke-dashoffset: 12; animation: draw 4s cubic-bezier(.23,1,.32,1) infinite; }
    @keyframes draw { 20%, 80% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 12 } }
    .scan { transform-box: fill-box; transform-origin: center; animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 50% { transform: scale(1.18) } }
    .lift { transform-box: fill-box; transform-origin: center; animation: lift 3.4s ease-in-out infinite; }
    @keyframes lift { 50% { transform: translateY(-2.5px) } }
    .tilt { transform-box: fill-box; transform-origin: 50% 80%; animation: tilt 4.2s ease-in-out infinite; }
    @keyframes tilt { 30% { transform: rotate(-10deg) } 60% { transform: rotate(4deg) } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .draw { stroke-dashoffset: 0 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect class="glow" width="1280" height="320" fill="url(#glowA)"/>
    <rect class="glow" width="1280" height="320" fill="url(#glowB)" style="animation-delay:-3.5s"/>

    <!-- estrellas -->
    <g fill="#fff">
      <circle class="star" cx="420" cy="40" r="1.6"/><circle class="star" cx="610" cy="72" r="1.2"/><circle class="star" cx="760" cy="34" r="1.8"/>
      <circle class="star" cx="880" cy="96" r="1.1"/><circle class="star" cx="1010" cy="28" r="1.5"/><circle class="star" cx="1180" cy="64" r="1.3"/>
      <circle class="star" cx="560" cy="250" r="1.2"/><circle class="star" cx="300" cy="28" r="1.1"/><circle class="star" cx="1230" cy="190" r="1.4"/>
    </g>

    <!-- ondas -->
    <g opacity=".16" fill="#fff">
      <path class="wave1" d="M0 262 Q 80 236 160 262 T 320 262 T 480 262 T 640 262 T 800 262 T 960 262 T 1120 262 T 1280 262 T 1440 262 T 1600 262 T 1760 262 T 1920 262 T 2080 262 T 2240 262 T 2400 262 T 2560 262 V320 H0Z"/>
    </g>
    <g opacity=".10" fill="#fff">
      <path class="wave2" d="M-640 288 Q -560 272 -480 288 T -320 288 T -160 288 T 0 288 T 160 288 T 320 288 T 480 288 T 640 288 T 800 288 T 960 288 T 1120 288 T 1280 288 T 1440 288 T 1600 288 T 1760 288 T 1920 288 V320 H-640Z"/>
    </g>

    <!-- marca: brújula de Atlas -->
    <g transform="translate(84 92)">
      <rect width="120" height="120" rx="32" fill="url(#mark)"/>
      <rect width="120" height="120" rx="32" fill="none" stroke="rgba(255,255,255,.35)"/>
      <g transform="translate(20 20) scale(3.33)" class="ico" stroke-width="1.8">
        <circle cx="12" cy="12" r="10"/>
        <path class="needle" d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
      </g>
    </g>

    <!-- textos -->
    <text x="238" y="118" class="t3">ISO/IEC 27001 · GRC EN ESPAÑOL</text>
    <text x="234" y="190" class="t1" fill="url(#title)">ATLAS GRC</text>
    <text x="238" y="232" class="t2">Aprende la norma desde cero, practica y construye un SGSI real.</text>

    <!-- iconos de Lucide flotando, cada uno con su gesto -->
    <g transform="translate(930 70)">
      <g class="float"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path class="draw" d="m9 12 2 2 4-4"/></g></g>
    </g>
    <g transform="translate(1040 40)">
      <g class="float f2"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><g class="rock"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g><path d="M7 21h10"/><path d="M12 3v18"/></g></g>
    </g>
    <g transform="translate(1150 90)">
      <g class="float f3"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path class="draw" d="m9 15 2 2 4-4" style="animation-delay:-1.3s"/></g></g>
    </g>
    <g transform="translate(980 170)">
      <g class="float f4"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><g class="scan"><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></g></g></g>
    </g>
    <g transform="translate(1090 175)">
      <g class="float f5"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><path class="lift" d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g>
    </g>
    <g transform="translate(850 150)">
      <g class="float f6"><circle class="chip" cx="28" cy="28" r="28"/><g transform="translate(14 14) scale(1.17)" class="ico"><g class="tilt"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/></g><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></g></g>
    </g>
  </g>
</svg>
